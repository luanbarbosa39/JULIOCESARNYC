<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Julio Cesar NYC">
    <link rel="shortcut icon" href="img/icone.png" type="image/png" />
    <script src="https://kit.fontawesome.com/64c0754995.js" crossorigin="anonymous"></script>
    <title>Júlio César NYC</title>
    <link href="css/bootstrap5.min.css" rel="stylesheet">
    <link href="css/business-casual.css" rel="stylesheet">
    <link href="css/header-footer.css?v=2" rel="stylesheet">
    <link href="css/layout.css?v=2" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
    <meta name="description" content="Júlio César NYC - Exclusive high fashion collections by designer Júlio César. Explore our latest designs, collections, and couture creations.">
    <meta property="og:title" content="Júlio César NYC - High Fashion Designer">
    <meta property="og:description" content="Explore exclusive high fashion collections by Júlio César NYC">
    <meta property="og:image" content="https://juliocesarnyc.com/img/waters/01.jpg">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="css/glightbox.min.css" />
    <script src="js/translation-system.js"></script>
    <script src="js/collections-loader.js"></script>
    <script src="custom.js?v=2"></script>
</head>
<body>
    <my-header></my-header>

    <div id="myCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="4" aria-label="Slide 5"></button>
        </div>
        <div class="carousel-inner" id="carousel-inner">
            <div class="carousel-item active">
                <img src="img/waters/01.jpg" class="d-block w-100" alt="Waters of March - Oversized jacquard jacket">
                <div class="carousel-caption">
                    <h3>Waters of March</h3>
                    <p>Fall/Winter 2026 — Latest Collection</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/waters/06.jpg" class="d-block w-100" alt="Waters of March - Red floral maxi dress">
                <div class="carousel-caption">
                    <h3>Waters of March</h3>
                    <p>Fall/Winter 2026</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/waters/11.jpg" class="d-block w-100" alt="Waters of March - Blue lace jumpsuit">
                <div class="carousel-caption">
                    <h3>Waters of March</h3>
                    <p>Fall/Winter 2026</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/waters/15.jpg" class="d-block w-100" alt="Waters of March - Black floral maxi dress">
                <div class="carousel-caption">
                    <h3>Waters of March</h3>
                    <p>Fall/Winter 2026</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/waters/19.jpg" class="d-block w-100" alt="Waters of March - White boucle coat">
                <div class="carousel-caption">
                    <h3>Waters of March</h3>
                    <p>Fall/Winter 2026</p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <my-footer></my-footer>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="js/bootstrap5.bundle.min.js"></script>
</body>
</html>
